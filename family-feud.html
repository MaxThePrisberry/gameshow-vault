<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Feud Game</title>
    <style>
        :root {
            /* Theme Variables - Classic (default) */
            --primary-color: #FFD700;
            --secondary-color: #FFC107;
            --background-color: #1a1a1a;
            --card-bg-color: #2a2a2a;
            --element-bg-color: #333;
            --highlight-color: #444;
            --text-color: white;
            --accent-color-1: #007bff;
            --accent-color-2: #dc3545;
            --success-color: #28a745;
            
            /* Font Sizes - Normal by default */
            --title-size: 3rem;
            --subtitle-size: 1.5rem;
            --text-size: 1rem;
            --large-text: 1.2rem;
        }
        
        /* TV mode */
        body.tv-mode {
            --title-size: 4rem;
            --subtitle-size: 2rem;
            --text-size: 1.5rem;
            --large-text: 1.8rem;
        }
        
        /* TV mode adjustments */
        body.tv-mode .game-container {
            height: 95vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        body.tv-mode .game-container .answers {
            max-height: 50vh;
            overflow: visible;
        }
        
        body.tv-mode .game-container .all-revealed-message,
        body.tv-mode .game-container .all-revealed-bonus {
            position: absolute;
            bottom: 180px;
            left: 0;
            right: 0;
            z-index: 10;
            background-color: rgba(0,0,0,0.8);
            padding: 10px;
            margin: 0;
        }
        
        body.tv-mode .game-container .teams {
            margin-top: auto;
        }
        
        /* Blue Theme */
        body.theme-blue {
            --primary-color: #1E90FF;
            --secondary-color: #00BFFF;
            --accent-color-1: #4169E1;
            --accent-color-2: #FF6347;
        }
        
        /* Green Theme */
        body.theme-green {
            --primary-color: #32CD32;
            --secondary-color: #00FA9A;
            --accent-color-1: #228B22;
            --accent-color-2: #FF6347;
        }
        
        /* Purple Theme */
        body.theme-purple {
            --primary-color: #9370DB;
            --secondary-color: #BA55D3;
            --accent-color-1: #663399;
            --accent-color-2: #FF6347;
        }
        
        /* Red Theme */
        body.theme-red {
            --primary-color: #FF4500;
            --secondary-color: #FF7F50;
            --accent-color-1: #CD5C5C;
            --accent-color-2: #4682B4;
        }
        
        * {
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--primary-color);
            font-size: var(--title-size);
            margin-bottom: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            transition: color 0.3s ease;
        }
        .setup-container, .game-container, .final-score-container {
            background-color: var(--card-bg-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease;
        }
        .question-form {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .answer-group {
            display: grid;
            grid-template-columns: 1fr 100px;
            gap: 10px;
            align-items: center;
        }
        .answer-groups-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        input, textarea, button, select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: var(--element-bg-color);
            color: var(--text-color);
            font-size: var(--text-size);
            transition: all 0.3s ease;
        }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        button {
            background-color: var(--primary-color);
            color: #000;
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: var(--secondary-color);
        }
        .questions-list {
            margin-top: 20px;
        }
        .question-item {
            background-color: var(--element-bg-color);
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.3s ease;
        }
        .question-text {
            flex-grow: 1;
        }
        .question-item button {
            margin-left: 10px;
        }
        .start-game {
            margin-top: 20px;
            padding: 15px;
            font-size: var(--large-text);
            background-color: var(--success-color);
        }
        .start-game:hover {
            opacity: 0.9;
        }
        .add-answer-btn {
            background-color: var(--accent-color-1);
            margin-bottom: 10px;
        }
        .remove-answer-btn {
            background-color: var(--accent-color-2);
            width: 30px;
            height: 30px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .board {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        .question-display {
            text-align: center;
            font-size: var(--subtitle-size);
            margin-bottom: 20px;
            padding: 15px;
            background-color: var(--element-bg-color);
            border-radius: 5px;
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .answers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        /* TV mode can handle 2 columns of 4 answers (8 total) */
        body.tv-mode .answers {
            grid-template-columns: repeat(2, 1fr);
        }
        .answer {
            background-color: var(--highlight-color);
            height: 80px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: var(--large-text);
            overflow: hidden;
            position: relative;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
        }
        body.tv-mode .answer {
            height: 100px;
        }
        .answer.revealed .answer-text, 
        .answer.revealed .answer-votes {
            opacity: 1;
        }
        .answer:not(.revealed)::before {
            content: attr(data-number);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: var(--primary-color);
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        body.tv-mode .answer:not(.revealed)::before {
            font-size: 3rem;
        }
        .answer-text {
            opacity: 0;
            transition: opacity 0.5s;
        }
        .answer-votes {
            background-color: var(--primary-color);
            color: #000;
            padding: 5px 10px;
            border-radius: 50%;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        body.tv-mode .answer-votes {
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
        }
        .all-revealed-bonus {
            background-color: var(--primary-color);
            color: #000;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        .teams {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .team {
            background-color: var(--element-bg-color);
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .team-name {
            font-size: var(--subtitle-size);
            margin-bottom: 10px;
        }
        .team-score {
            font-size: calc(var(--subtitle-size) * 1.5);
            font-weight: bold;
            color: var(--primary-color);
            transition: color 0.3s ease;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .team1-votes {
            background-color: var(--accent-color-1);
        }
        .team2-votes {
            background-color: var(--accent-color-2);
        }
        .strike-btn {
            background-color: var(--accent-color-2);
            grid-column: span 3;
        }
        .next-question {
            background-color: var(--success-color);
        }
        .new-game {
            grid-column: span 3;
            background-color: #6c757d;
            margin-top: 10px;
        }
        body.tv-mode .controls button {
            padding: 15px;
            font-size: var(--large-text);
        }
        .strike-container {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }
        .strike {
            width: 50px;
            height: 50px;
            margin: 0 10px;
            border-radius: 50%;
            background-color: var(--highlight-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        body.tv-mode .strike {
            width: 80px;
            height: 80px;
            font-size: 3rem;
            margin: 0 15px;
        }
        .strike.active {
            background-color: var(--accent-color-2);
            color: white;
        }
        .setup-container.hidden, 
        .game-container.hidden,
        .final-score-container.hidden {
            display: none;
        }
        .all-revealed-message {
            text-align: center;
            color: var(--primary-color);
            font-size: var(--subtitle-size);
            margin: 20px 0;
            display: none;
            transition: color 0.3s ease;
        }
        .game-settings {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .game-settings label {
            font-weight: bold;
        }
        .game-settings input[type="number"] {
            width: 80px;
        }
        .action-button {
            margin-top: 10px;
            background-color: #17a2b8;
        }
        
        /* Round counter display */
        .round-display {
            text-align: center;
            color: var(--primary-color);
            font-size: var(--subtitle-size);
            margin-bottom: 15px;
            font-weight: bold;
        }
        .game-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: var(--primary-color);
            padding: 20px;
            border-radius: 10px;
            font-size: var(--subtitle-size);
            font-weight: bold;
            z-index: 100;
            text-align: center;
            max-width: 80%;
        }
        
        /* Final Score Screen styles */
        .final-score-container {
            text-align: center;
        }
        .final-score-title {
            font-size: var(--title-size);
            color: var(--primary-color);
            margin-bottom: 30px;
        }
        .final-scores {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-bottom: 30px;
        }
        .final-team {
            background-color: var(--element-bg-color);
            padding: 20px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .final-team.winner {
            background-color: var(--primary-color);
            color: #000;
        }
        .final-team-name {
            font-size: var(--subtitle-size);
            margin-bottom: 15px;
        }
        .final-team-score {
            font-size: calc(var(--subtitle-size) * 2);
            font-weight: bold;
        }
        .final-result {
            font-size: var(--subtitle-size);
            color: var(--primary-color);
            margin: 20px 0 30px;
            font-weight: bold;
        }
        .return-home-btn {
            background-color: var(--success-color);
            padding: 15px 30px;
            font-size: var(--large-text);
            max-width: 300px;
            margin: 0 auto;
        }
        
        /* Game over modal */
        #game-over-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background-color: var(--card-bg-color);
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            .answers {
                grid-template-columns: 1fr;
            }
            .controls {
                grid-template-columns: 1fr;
            }
            .new-game, .strike-btn {
                grid-column: auto;
            }
            .final-scores {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Family Feud</h1>
        </header>

        <!-- Game Setup Screen -->
        <div class="setup-container">
            <h2>Game Setup</h2>
            <!-- Question Input Form -->
            <div class="question-form">
                <input type="text" id="question-input" placeholder="Enter a question..." required>
                <div class="answer-groups-container" id="answer-groups">
                    <div class="answer-group">
                        <input type="text" class="answer-input" placeholder="Answer 1" required>
                        <input type="number" class="votes-input" placeholder="Votes" min="1" required>
                    </div>
                    <div class="answer-group">
                        <input type="text" class="answer-input" placeholder="Answer 2" required>
                        <input type="number" class="votes-input" placeholder="Votes" min="1" required>
                    </div>
                    <div class="answer-group">
                        <input type="text" class="answer-input" placeholder="Answer 3" required>
                        <input type="number" class="votes-input" placeholder="Votes" min="1" required>
                    </div>
                    <div class="answer-group">
                        <input type="text" class="answer-input" placeholder="Answer 4" required>
                        <input type="number" class="votes-input" placeholder="Votes" min="1" required>
                    </div>
                </div>
                <div id="variable-answers-controls" style="display: none;">
                    <button id="add-answer-field-btn" class="add-answer-btn">+ Add Another Answer</button>
                </div>
                <button id="add-question-btn">Add Question</button>
            </div>

            <!-- Questions List -->
            <div class="questions-list">
                <h3>Added Questions</h3>
                <div id="questions-container"></div>
            </div>

            <!-- Team Names -->
            <div class="question-form" style="margin-top: 20px;">
                <h3>Team Names</h3>
                <input type="text" id="team1-name" placeholder="Team 1 Name" value="Team 1">
                <input type="text" id="team2-name" placeholder="Team 2 Name" value="Team 2">
            </div>

            <!-- Game Settings -->
            <div class="question-form" style="margin-top: 20px;">
                <h3>Game Settings</h3>
                
                <!-- Basic Game Rules -->
                <div class="game-settings">
                    <label for="max-strikes">Number of Strikes:</label>
                    <input type="number" id="max-strikes" min="1" max="10" value="3">
                </div>
                
                <div class="game-settings">
                    <label for="bonus-points">Bonus Points for All Answers:</label>
                    <input type="number" id="bonus-points" min="0" max="1000" value="0" placeholder="0 = disabled">
                </div>
                
                <div class="game-settings">
                    <label for="num-rounds">Number of Rounds:</label>
                    <input type="number" id="num-rounds" min="1" max="100" placeholder="All questions">
                </div>
                
                <div class="game-settings">
                    <input type="checkbox" id="randomize-questions">
                    <label for="randomize-questions">Randomize Question Order</label>
                </div>
                
                <!-- Variable Answer Count -->
                <div class="game-settings">
                    <label for="num-answers">Number of Answers per Question:</label>
                    <select id="num-answers">
                        <option value="4" selected>4 (Default)</option>
                        <option value="variable">Variable (2-8)</option>
                    </select>
                </div>
                
                <!-- Theme Selection -->
                <div class="game-settings">
                    <label for="theme-select">Color Theme:</label>
                    <select id="theme-select">
                        <option value="classic" selected>Classic (Gold/Black)</option>
                        <option value="blue">Blue</option>
                        <option value="green">Green</option>
                        <option value="purple">Purple</option>
                        <option value="red">Red</option>
                    </select>
                </div>
                
                <!-- TV Mode Option -->
                <div class="game-settings">
                    <input type="checkbox" id="tv-mode">
                    <label for="tv-mode">TV Mode (larger text, optimized for big screens)</label>
                </div>
            </div>

            <!-- Save/Load Questions -->
            <div style="display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap;">
                <button id="save-questions-btn" style="background-color: #007bff;">Save Questions</button>
                <button id="load-questions-btn" style="background-color: #6c757d;">Load Saved Questions</button>
                <button id="download-cheatsheet-btn" style="background-color: #17a2b8;">Download Cheat Sheet</button>
                <button id="delete-all-questions-btn" style="background-color: #dc3545;">Delete All Questions</button>
            </div>
            
            <!-- Export/Import Questions -->
            <div style="display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap;">
                <button id="export-questions-btn" style="background-color: #28a745;">Export Questions</button>
                <button id="import-questions-btn" style="background-color: #fd7e14;">Import Questions</button>
                <input type="file" id="import-file" accept=".json" style="display: none;">
            </div>

            <!-- Start Game Button -->
            <button class="start-game" id="start-game-btn">Start Game</button>
        </div>

        <!-- Game Board Screen -->
        <div class="game-container hidden">
            <!-- Round Display -->
            <div class="round-display" id="round-display">
                Round 1
            </div>
            
            <!-- Current Question -->
            <div class="question-display" id="current-question">
                Question will appear here
            </div>

            <!-- Strikes -->
            <div class="strike-container" id="strike-container">
                <!-- Strikes will be dynamically generated based on settings -->
            </div>

            <!-- Answers Board -->
            <div class="board">
                <div class="answers" id="answers-board">
                    <!-- Answers will be generated here -->
                </div>
            </div>

            <div class="all-revealed-message" id="all-revealed">
                All answers have been revealed!
            </div>
            
            <div class="all-revealed-bonus" id="bonus-message">
                BONUS! +0 points for revealing all answers!
            </div>
            
            <!-- Notification Messages (combined in TV mode) -->
            <div class="game-notification" id="game-notification" style="display: none;">
                <div class="notification-content"></div>
            </div>

            <!-- Teams Score -->
            <div class="teams">
                <div class="team">
                    <div class="team-name" id="display-team1-name">Team 1</div>
                    <div class="team-score" id="team1-score">0</div>
                </div>
                <div class="team">
                    <div class="team-name" id="display-team2-name">Team 2</div>
                    <div class="team-score" id="team2-score">0</div>
                </div>
            </div>

            <!-- Game Controls -->
            <div class="controls">
                <button class="team1-votes" id="team1-add-btn">+Votes to Team 1</button>
                <button class="next-question" id="next-question-btn">Next Question</button>
                <button class="team2-votes" id="team2-add-btn">+Votes to Team 2</button>
                <button class="strike-btn" id="strike-btn">Record Strike</button>
                <button class="new-game" id="new-game-btn">New Game</button>
            </div>
        </div>

        <!-- Final Score Screen -->
        <div class="final-score-container hidden">
            <h2 class="final-score-title">Game Over!</h2>
            
            <div class="final-scores">
                <div class="final-team" id="final-team1">
                    <div class="final-team-name" id="final-team1-name">Team 1</div>
                    <div class="final-team-score" id="final-team1-score">0</div>
                </div>
                <div class="final-team" id="final-team2">
                    <div class="final-team-name" id="final-team2-name">Team 2</div>
                    <div class="final-team-score" id="final-team2-score">0</div>
                </div>
            </div>
            
            <div class="final-result" id="final-result">Winner!</div>
            
            <button class="return-home-btn" id="return-home-btn">Return to Home</button>
        </div>
        
        <!-- Game Over Modal -->
        <div id="game-over-modal">
            <div class="modal-content">
                <h2 class="final-score-title">Game Over!</h2>
                
                <div class="final-scores">
                    <div class="final-team" id="final-team1">
                        <div class="final-team-name" id="final-team1-name">Team 1</div>
                        <div class="final-team-score" id="final-team1-score">0</div>
                    </div>
                    <div class="final-team" id="final-team2">
                        <div class="final-team-name" id="final-team2-name">Team 2</div>
                        <div class="final-team-score" id="final-team2-score">0</div>
                    </div>
                </div>
                
                <div class="final-result" id="final-result">Winner!</div>
                
                <button class="return-home-btn" id="return-home-btn">Return to Home</button>
            </div>
        </div>
    </div>

    <script>
        // Game state
        const gameState = {
            questions: [],
            currentQuestionIndex: 0,
            team1Score: 0,
            team2Score: 0,
            currentStrikes: 0,
            maxStrikes: 3, // Default value, can be customized
            revealedAnswers: [],
            bonusPoints: 0, // Bonus points for revealing all answers
            maxRounds: null, // Number of rounds (null = use all questions)
            randomizeQuestions: false, // Whether to randomize question order
            variableAnswers: false, // Whether to allow variable number of answers
            playOrder: [], // Array of indices for question order
            currentRound: 1 // Current round number
        };

        // DOM elements
        const setupContainer = document.querySelector('.setup-container');
        const gameContainer = document.querySelector('.game-container');
        const finalScoreContainer = document.querySelector('.final-score-container');
        const questionInput = document.getElementById('question-input');
        const answerGroupsContainer = document.getElementById('answer-groups');
        const addQuestionBtn = document.getElementById('add-question-btn');
        const questionsContainer = document.getElementById('questions-container');
        const startGameBtn = document.getElementById('start-game-btn');
        const saveQuestionsBtn = document.getElementById('save-questions-btn');
        const loadQuestionsBtn = document.getElementById('load-questions-btn');
        const downloadCheatsheetBtn = document.getElementById('download-cheatsheet-btn');

        const answersBoard = document.getElementById('answers-board');
        const team1ScoreDisplay = document.getElementById('team1-score');
        const team2ScoreDisplay = document.getElementById('team2-score');

        // Will store current strike elements
        let strikes = [];

        // Function to generate strike elements based on maxStrikes
        function generateStrikeElements() {
            strikeContainer.innerHTML = '';
            
            for (let i = 0; i < gameState.maxStrikes; i++) {
                const strikeEl = document.createElement('div');
                strikeEl.className = 'strike';
                strikeEl.textContent = 'X';
                strikeContainer.appendChild(strikeEl);
            }
            
            // Update the strikes reference
            strikes = Array.from(document.querySelectorAll('.strike'));
        }
        
        // Theme handling
        themeSelect.addEventListener('change', updateTheme);
        tvModeInput.addEventListener('change', updateTVMode);
        
        function updateTheme() {
            // First reset all theme classes
            document.body.classList.remove('theme-blue', 'theme-green', 'theme-purple', 'theme-red');
            
            // Apply the selected theme
            const theme = themeSelect.value;
            if (theme !== 'classic') {
                document.body.classList.add(`theme-${theme}`);
            }
        }
        
        function updateTVMode() {
            if (tvModeInput.checked) {
                document.body.classList.add('tv-mode');
            } else {
                document.body.classList.remove('tv-mode');
            }
        }
        
        // Show final score screen
        function showFinalScoreScreen() {
            try {
                // Get final scores
                const finalTeam1Name = document.getElementById('final-team1-name');
                const finalTeam2Name = document.getElementById('final-team2-name');
                const finalTeam1Score = document.getElementById('final-team1-score');
                const finalTeam2Score = document.getElementById('final-team2-score');
                const finalResult = document.getElementById('final-result');
                
                // Update final score display
                finalTeam1Name.textContent = displayTeam1Name.textContent;
                finalTeam2Name.textContent = displayTeam2Name.textContent;
                finalTeam1Score.textContent = gameState.team1Score;
                finalTeam2Score.textContent = gameState.team2Score;
                
                // Determine winner
                const team1Won = gameState.team1Score > gameState.team2Score;
                const team2Won = gameState.team2Score > gameState.team1Score;
                const isTie = gameState.team1Score === gameState.team2Score;
                
                // Reset winner classes
                document.querySelectorAll('.final-team').forEach(el => el.classList.remove('winner'));
                
                // Display appropriate result message
                if (isTie) {
                    finalResult.textContent = "It's a tie!";
                } else {
                    finalResult.textContent = "Winner!";
                    if (team1Won) {
                        document.querySelectorAll('.final-team')[0].classList.add('winner');
                    } else {
                        document.querySelectorAll('.final-team')[1].classList.add('winner');
                    }
                }
                
                // Hide game container, show final score
                gameContainer.classList.add('hidden');
                finalScoreContainer.classList.remove('hidden');
            } catch (error) {
                console.error("Error showing final score:", error);
                alert("Error showing final score. Returning to setup screen.");
                gameContainer.classList.add('hidden');
                setupContainer.classList.remove('hidden');
                document.body.classList.remove('tv-mode');
            }
        }
        numAnswersSelect.addEventListener('change', function() {
            if (this.value === 'variable') {
                gameState.variableAnswers = true;
                variableAnswersControls.style.display = 'block';
                
                // Add delete buttons to answers 3 and 4
                const answerGroups = answerGroupsContainer.querySelectorAll('.answer-group');
                answerGroups.forEach((group, index) => {
                    // Add remove buttons to answers 3 and 4 (index 2 and 3)
                    if (index >= 2 && !group.querySelector('.remove-answer-btn')) {
                        const removeBtn = document.createElement('button');
                        removeBtn.className = 'remove-answer-btn';
                        removeBtn.textContent = 'X';
                        removeBtn.addEventListener('click', function() {
                            answerGroupsContainer.removeChild(group);
                        });
                        group.appendChild(removeBtn);
                    }
                });
            } else {
                gameState.variableAnswers = false;
                variableAnswersControls.style.display = 'none';
                
                // Reset to exactly 4 answer fields without delete buttons
                answerGroupsContainer.innerHTML = '';
                for (let i = 0; i < 4; i++) {
                    addAnswerField(i + 1);
                }
            }
        });
        
        // Add new answer field
        addAnswerFieldBtn.addEventListener('click', function() {
            const currentAnswerCount = answerGroupsContainer.children.length;
            if (currentAnswerCount < 8) { // Limit to 8 answers max
                addAnswerField(currentAnswerCount + 1);
            } else {
                alert('Maximum 8 answers allowed per question');
            }
        });
        
        function addAnswerField(number) {
            const answerGroup = document.createElement('div');
            answerGroup.className = 'answer-group';
            
            const answerInput = document.createElement('input');
            answerInput.type = 'text';
            answerInput.className = 'answer-input';
            answerInput.placeholder = `Answer ${number}`;
            answerInput.required = number <= 4; // First 4 are required
            
            const votesInput = document.createElement('input');
            votesInput.type = 'number';
            votesInput.className = 'votes-input';
            votesInput.placeholder = 'Votes';
            votesInput.min = 1;
            votesInput.required = number <= 4; // First 4 are required
            
            answerGroup.appendChild(answerInput);
            answerGroup.appendChild(votesInput);
            
            // Only add remove button for answers beyond the first 2
            // AND only when in variable answer mode OR beyond answer 4
            const isVariableMode = numAnswersSelect.value === 'variable';
            if (number > 2 && (isVariableMode || number > 4)) {
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-answer-btn';
                removeBtn.textContent = 'X';
                removeBtn.addEventListener('click', function() {
                    answerGroupsContainer.removeChild(answerGroup);
                });
                answerGroup.appendChild(removeBtn);
            }
            
            answerGroupsContainer.appendChild(answerGroup);
        }

        // Add question to the game
        addQuestionBtn.addEventListener('click', () => {
            const questionText = questionInput.value.trim();
            if (!questionText) {
                alert('Please enter a question');
                return;
            }

            const answers = [];
            let isValid = true;
            
            // Get all answer groups
            const answerGroups = answerGroupsContainer.querySelectorAll('.answer-group');
            
            // Validate required answers have text and votes
            answerGroups.forEach((group, index) => {
                const answerInput = group.querySelector('.answer-input');
                const votesInput = group.querySelector('.votes-input');
                
                if (!answerInput || !votesInput) return;
                
                const answerText = answerInput.value.trim();
                const votes = parseInt(votesInput.value);
                
                // First 2 answers are always required
                const isRequired = index < 2 || answerInput.required;
                
                if (isRequired && (!answerText || isNaN(votes) || votes <= 0)) {
                    isValid = false;
                    alert(`Please fill in all required answers and votes`);
                    return;
                }
                
                // Add non-empty answers
                if (answerText && !isNaN(votes) && votes > 0) {
                    answers.push({
                        text: answerText,
                        votes: votes
                    });
                }
            });

            if (!isValid || answers.length < 2) {
                if (answers.length < 2) {
                    alert('You need at least 2 answers for a question');
                }
                return;
            }

            // Sort answers by votes (highest first), then alphabetically for ties
            answers.sort((a, b) => {
                if (b.votes === a.votes) {
                    return a.text.localeCompare(b.text); // Alphabetical for ties
                }
                return b.votes - a.votes;
            });

            // Add to game state
            const question = {
                text: questionText,
                answers: answers
            };
            gameState.questions.push(question);

            // Add to visual list
            displayQuestion(question, gameState.questions.length - 1);

            // Clear the form
            questionInput.value = '';
            
            // Reset answer fields based on current mode
            if (gameState.variableAnswers) {
                // Keep the structure but clear values
                answerGroups.forEach(group => {
                    const answerInput = group.querySelector('.answer-input');
                    const votesInput = group.querySelector('.votes-input');
                    if (answerInput) answerInput.value = '';
                    if (votesInput) votesInput.value = '';
                });
            } else {
                // Reset to exactly 4 answer fields
                answerGroupsContainer.innerHTML = '';
                for (let i = 0; i < 4; i++) {
                    addAnswerField(i + 1);
                }
            }
        });

        // Display question in the list
        function displayQuestion(question, index) {
            const questionItem = document.createElement('div');
            questionItem.className = 'question-item';
            
            const questionText = document.createElement('div');
            questionText.className = 'question-text';
            questionText.textContent = question.text;
            
            const removeBtn = document.createElement('button');
            removeBtn.textContent = 'Remove';
            removeBtn.addEventListener('click', () => {
                gameState.questions.splice(index, 1);
                renderQuestionsList();
            });
            
            questionItem.appendChild(questionText);
            questionItem.appendChild(removeBtn);
            questionsContainer.appendChild(questionItem);
        }

        // Render the questions list
        function renderQuestionsList() {
            questionsContainer.innerHTML = '';
            gameState.questions.forEach((question, index) => {
                displayQuestion(question, index);
            });
        }

        // Start the game
        startGameBtn.addEventListener('click', () => {
            if (gameState.questions.length === 0) {
                alert('Please add at least one question');
                return;
            }

            // Set team names
            const team1Name = team1NameInput.value.trim() || 'Team 1';
            const team2Name = team2NameInput.value.trim() || 'Team 2';
            displayTeam1Name.textContent = team1Name;
            displayTeam2Name.textContent = team2Name;
            
            // Set max strikes
            const maxStrikes = parseInt(maxStrikesInput.value);
            if (isNaN(maxStrikes) || maxStrikes < 1) {
                gameState.maxStrikes = 3; // Default to 3 if invalid
            } else {
                gameState.maxStrikes = maxStrikes;
            }
            
            // Set bonus points
            const bonusPoints = parseInt(bonusPointsInput.value);
            gameState.bonusPoints = isNaN(bonusPoints) ? 0 : bonusPoints;
            
            // Set number of rounds
            const numRounds = parseInt(numRoundsInput.value);
            if (!isNaN(numRounds) && numRounds > 0) {
                gameState.maxRounds = Math.min(numRounds, gameState.questions.length);
            } else {
                gameState.maxRounds = null; // Use all questions
            }
            
            // Set randomize questions
            gameState.randomizeQuestions = randomizeQuestionsInput.checked;
            
            // Create play order
            if (gameState.randomizeQuestions) {
                // Create array of indices and shuffle it
                gameState.playOrder = Array.from({ length: gameState.questions.length }, (_, i) => i);
                // Fisher-Yates shuffle
                for (let i = gameState.playOrder.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [gameState.playOrder[i], gameState.playOrder[j]] = [gameState.playOrder[j], gameState.playOrder[i]];
                }
            } else {
                // Just use sequential order
                gameState.playOrder = Array.from({ length: gameState.questions.length }, (_, i) => i);
            }
            
            // Apply TV mode if checked
            updateTVMode();
            
            // Generate strike elements based on settings
            generateStrikeElements();

            // Switch to game view
            setupContainer.classList.add('hidden');
            gameContainer.classList.remove('hidden');
            finalScoreContainer.classList.add('hidden');

            // Initialize game
            gameState.currentQuestionIndex = 0;
            gameState.currentRound = 1;
            gameState.team1Score = 0;
            gameState.team2Score = 0;
            team1ScoreDisplay.textContent = '0';
            team2ScoreDisplay.textContent = '0';
            
            updateRoundDisplay();
            loadQuestion(gameState.playOrder[0]);
        });

        // Update round display
        function updateRoundDisplay() {
            // If max rounds is set, show "Round X of Y"
            if (gameState.maxRounds) {
                roundDisplay.textContent = `Round ${gameState.currentRound} of ${gameState.maxRounds}`;
            } else {
                roundDisplay.textContent = `Round ${gameState.currentRound}`;
            }
        }
        
        // Load a question into the game board
        function loadQuestion(index) {
            // Check if we've reached the end based on maxRounds or all questions
            const isGameOver = gameState.maxRounds 
                ? gameState.currentRound > gameState.maxRounds 
                : gameState.currentQuestionIndex >= gameState.questions.length;
            
            if (isGameOver || index >= gameState.questions.length) {
                // Show final score screen
                showFinalScoreScreen();
                return;
            }

            // Reset game state for new question
            gameState.currentStrikes = 0;
            gameState.revealedAnswers = [];
            allRevealedMessage.style.display = 'none';
            bonusMessage.style.display = 'none';
            
            // Update strikes display
            updateStrikesDisplay();

            // Get the question
            const question = gameState.questions[index];
            currentQuestionDisplay.textContent = question.text;

            // Filter answers based on the answer count setting
            let answersToDisplay = question.answers;
            if (!gameState.variableAnswers && answersToDisplay.length > 4) {
                // If using fixed 4 answers mode, only use the top 4 answers by votes
                answersToDisplay = answersToDisplay.slice(0, 4);
            }

            // Create answer board
            answersBoard.innerHTML = '';
            answersToDisplay.forEach((answer, answerIndex) => {
                const answerEl = document.createElement('div');
                answerEl.className = 'answer';
                answerEl.dataset.index = answerIndex;
                answerEl.dataset.number = answerIndex + 1; // Add number attribute for display

                const answerText = document.createElement('div');
                answerText.className = 'answer-text';
                answerText.textContent = answer.text;

                const answerVotes = document.createElement('div');
                answerVotes.className = 'answer-votes';
                answerVotes.textContent = answer.votes;

                answerEl.appendChild(answerText);
                answerEl.appendChild(answerVotes);
                answersBoard.appendChild(answerEl);

                // Add click event to reveal answer
                answerEl.addEventListener('click', () => {
                    revealAnswer(answerIndex);
                });
            });
        }
        
        // Show game over modal
        function showGameOverModal() {
            // Get the modal elements
            const finalTeam1Name = document.getElementById('final-team1-name');
            const finalTeam2Name = document.getElementById('final-team2-name');
            const finalTeam1Score = document.getElementById('final-team1-score');
            const finalTeam2Score = document.getElementById('final-team2-score');
            const finalResult = document.getElementById('final-result');
            const finalTeam1 = document.getElementById('final-team1');
            const finalTeam2 = document.getElementById('final-team2');
            
            // Update team names and scores
            finalTeam1Name.textContent = displayTeam1Name.textContent;
            finalTeam2Name.textContent = displayTeam2Name.textContent;
            finalTeam1Score.textContent = gameState.team1Score;
            finalTeam2Score.textContent = gameState.team2Score;
            
            // Reset winner classes
            finalTeam1.classList.remove('winner');
            finalTeam2.classList.remove('winner');
            
            // Determine and display winner
            if (gameState.team1Score > gameState.team2Score) {
                finalResult.textContent = `${finalTeam1Name.textContent} Wins!`;
                finalTeam1.classList.add('winner');
            } else if (gameState.team2Score > gameState.team1Score) {
                finalResult.textContent = `${finalTeam2Name.textContent} Wins!`;
                finalTeam2.classList.add('winner');
            } else {
                finalResult.textContent = "It's a Tie!";
            }
            
            // Show the modal
            gameOverModal.style.display = 'flex';
        }
        
        // Event listener for return home button
        returnHomeBtn.addEventListener('click', function() {
            // Hide game over screen
            gameOverModal.style.display = 'none';
            finalScoreContainer.classList.add('hidden');
            
            // Show setup screen
            setupContainer.classList.remove('hidden');
            
            // Remove TV mode
            document.body.classList.remove('tv-mode');
        });
        
        function showNotification(message, callback) {
            // Use the game notification for TV mode, alert for normal mode
            if (tvModeInput.checked) {
                const notification = document.getElementById('game-notification');
                const content = notification.querySelector('.notification-content');
                content.textContent = message;
                notification.style.display = 'block';
                
                // Hide after 3 seconds
                setTimeout(() => {
                    notification.style.display = 'none';
                    if (callback) callback();
                }, 3000);
            } else {
                alert(message);
                if (callback) callback();
            }
        }
        
        // Variable answer count handling

        // Reveal an answer
        function revealAnswer(index) {
            // Get the actual question index based on play order
            const questionIndex = gameState.playOrder[gameState.currentQuestionIndex];
            const currentQuestion = gameState.questions[questionIndex];
            const answerElements = document.querySelectorAll('.answer');
            
            // Skip if already revealed
            if (gameState.revealedAnswers.includes(index)) {
                return;
            }
            
            // Add to revealed list
            gameState.revealedAnswers.push(index);
            
            // Reveal in UI
            answerElements[index].classList.add('revealed');

            // Get the number of answers currently being displayed
            const displayedAnswerCount = !gameState.variableAnswers && currentQuestion.answers.length > 4 
                ? 4 
                : currentQuestion.answers.length;

            // Check if all answers are revealed
            if (gameState.revealedAnswers.length === displayedAnswerCount) {
                if (tvModeInput.checked) {
                    // In TV mode, show a combined notification
                    const message = gameState.bonusPoints > 0 
                        ? `All answers revealed! BONUS: +${gameState.bonusPoints} points!` 
                        : 'All answers revealed!';
                    showNotification(message);
                } else {
                    // In regular mode, show the standard messages
                    allRevealedMessage.style.display = 'block';
                    
                    // Show bonus message if bonus points are enabled
                    if (gameState.bonusPoints > 0) {
                        bonusMessage.textContent = `BONUS! +${gameState.bonusPoints} points for revealing all answers!`;
                        bonusMessage.style.display = 'block';
                    }
                }
            }
        }

        // Add votes to team 1
        team1AddBtn.addEventListener('click', () => {
            if (gameState.revealedAnswers.length === 0) {
                alert('Reveal at least one answer first!');
                return;
            }

            // Get the actual question index based on play order
            const questionIndex = gameState.playOrder[gameState.currentQuestionIndex];
            const currentQuestion = gameState.questions[questionIndex];
            
            // Get the answers being displayed
            let answersToUse = currentQuestion.answers;
            if (!gameState.variableAnswers && answersToUse.length > 4) {
                answersToUse = answersToUse.slice(0, 4);
            }
            
            let roundVotes = 0;

            // Sum votes from all revealed answers
            gameState.revealedAnswers.forEach(index => {
                roundVotes += answersToUse[index].votes;
            });

            // Add bonus points if all answers revealed
            if (gameState.revealedAnswers.length === answersToUse.length && gameState.bonusPoints > 0) {
                roundVotes += gameState.bonusPoints;
            }
            
            // Add to team score
            gameState.team1Score += roundVotes;
            team1ScoreDisplay.textContent = gameState.team1Score;

            // Move to next round/question
            gameState.currentQuestionIndex++;
            gameState.currentRound++;
            updateRoundDisplay();
            loadQuestion(gameState.playOrder[gameState.currentQuestionIndex]);
        });

        // Add votes to team 2
        team2AddBtn.addEventListener('click', () => {
            if (gameState.revealedAnswers.length === 0) {
                alert('Reveal at least one answer first!');
                return;
            }

            // Get the actual question index based on play order
            const questionIndex = gameState.playOrder[gameState.currentQuestionIndex];
            const currentQuestion = gameState.questions[questionIndex];
            
            // Get the answers being displayed
            let answersToUse = currentQuestion.answers;
            if (!gameState.variableAnswers && answersToUse.length > 4) {
                answersToUse = answersToUse.slice(0, 4);
            }
            
            let roundVotes = 0;

            // Sum votes from all revealed answers
            gameState.revealedAnswers.forEach(index => {
                roundVotes += answersToUse[index].votes;
            });
            
            // Add bonus points if all answers revealed
            if (gameState.revealedAnswers.length === answersToUse.length && gameState.bonusPoints > 0) {
                roundVotes += gameState.bonusPoints;
            }

            // Add to team score
            gameState.team2Score += roundVotes;
            team2ScoreDisplay.textContent = gameState.team2Score;

            // Move to next round/question
            gameState.currentQuestionIndex++;
            gameState.currentRound++;
            updateRoundDisplay();
            loadQuestion(gameState.playOrder[gameState.currentQuestionIndex]);
        });

        // Handle strikes (now with a single button)
        strikeBtn.addEventListener('click', () => {
            if (gameState.currentStrikes < gameState.maxStrikes) {
                gameState.currentStrikes++;
                updateStrikesDisplay();

                // If max strikes reached, optionally switch teams or move to next question
                if (gameState.currentStrikes === gameState.maxStrikes) {
                    if (confirm(`${gameState.maxStrikes} strikes! Move to next question?`)) {
                        gameState.currentQuestionIndex++;
                        gameState.currentRound++;
                        updateRoundDisplay();
                        loadQuestion(gameState.playOrder[gameState.currentQuestionIndex]);
                    }
                }
            }
        });

        function updateStrikesDisplay() {
            strikes.forEach((strike, index) => {
                if (index < gameState.currentStrikes) {
                    strike.classList.add('active');
                } else {
                    strike.classList.remove('active');
                }
            });
        }

        // Next question - Move to the next question
        nextQuestionBtn.addEventListener('click', () => {
            gameState.currentQuestionIndex++;
            gameState.currentRound++;
            updateRoundDisplay();
            loadQuestion(gameState.playOrder[gameState.currentQuestionIndex]);
        });

        // New game - Return to setup screen
        newGameBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to start a new game?')) {
                // Reset scores and question index
                gameState.team1Score = 0;
                gameState.team2Score = 0;
                gameState.currentQuestionIndex = 0; // Reset question index to start at beginning
                gameState.currentRound = 1; // Reset round counter
                team1ScoreDisplay.textContent = '0';
                team2ScoreDisplay.textContent = '0';
                
                // Return to the setup screen
                gameContainer.classList.add('hidden');
                finalScoreContainer.classList.add('hidden');
                setupContainer.classList.remove('hidden');
                
                // Remove TV mode when returning to setup
                document.body.classList.remove('tv-mode');
            }
        });
        
        // Generate and download cheat sheet
        downloadCheatsheetBtn.addEventListener('click', () => {
            if (gameState.questions.length === 0) {
                alert('No questions to generate cheat sheet. Please add questions first.');
                return;
            }
            
            // Create cheat sheet content
            let cheatSheetContent = "FAMILY FEUD CHEAT SHEET\n\n";
            
            gameState.questions.forEach((question, qIndex) => {
                cheatSheetContent += `Question ${qIndex + 1}: ${question.text}\n`;
                question.answers.forEach((answer, aIndex) => {
                    cheatSheetContent += `  ${aIndex + 1}. ${answer.text} (${answer.votes} votes)\n`;
                });
                cheatSheetContent += "\n";
            });
            
            // Create a download link
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(cheatSheetContent));
            element.setAttribute('download', 'family-feud-cheatsheet.txt');
            
            element.style.display = 'none';
            document.body.appendChild(element);
            
            element.click();
            
            document.body.removeChild(element);
        });
        
        // Save questions to localStorage
        saveQuestionsBtn.addEventListener('click', () => {
            if (gameState.questions.length === 0) {
                alert('No questions to save. Please add questions first.');
                return;
            }
            
            try {
                // Get team names and game settings
                const savedData = {
                    questions: gameState.questions,
                    team1Name: team1NameInput.value.trim() || 'Team 1',
                    team2Name: team2NameInput.value.trim() || 'Team 2',
                    maxStrikes: parseInt(maxStrikesInput.value) || 3,
                    bonusPoints: parseInt(bonusPointsInput.value) || 0,
                    theme: themeSelect.value,
                    tvMode: tvModeInput.checked,
                    variableAnswers: numAnswersSelect.value === 'variable',
                    numRounds: numRoundsInput.value ? parseInt(numRoundsInput.value) : null,
                    randomizeQuestions: randomizeQuestionsInput.checked
                };
                
                // Convert to JSON and save to localStorage
                localStorage.setItem('familyFeudData', JSON.stringify(savedData));
                
                alert('Game data saved successfully! It will be available the next time you open this game.');
            } catch (error) {
                alert('Error saving data: ' + error.message);
                console.error('Error saving data:', error);
            }
        });
        
        // Load questions from localStorage
        loadQuestionsBtn.addEventListener('click', () => {
            try {
                const savedData = localStorage.getItem('familyFeudData');
                
                if (!savedData) {
                    alert('No saved game data found. Add questions and save first.');
                    return;
                }
                
                const parsedData = JSON.parse(savedData);
                
                // Restore team names
                if (parsedData.team1Name) team1NameInput.value = parsedData.team1Name;
                if (parsedData.team2Name) team2NameInput.value = parsedData.team2Name;
                
                // Restore game settings
                if (parsedData.maxStrikes) maxStrikesInput.value = parsedData.maxStrikes;
                if (parsedData.bonusPoints !== undefined) bonusPointsInput.value = parsedData.bonusPoints;
                if (parsedData.numRounds) numRoundsInput.value = parsedData.numRounds;
                if (parsedData.randomizeQuestions !== undefined) randomizeQuestionsInput.checked = parsedData.randomizeQuestions;
                if (parsedData.variableAnswers !== undefined) {
                    numAnswersSelect.value = parsedData.variableAnswers ? 'variable' : '4';
                    // Trigger the change event to update UI
                    const event = new Event('change');
                    numAnswersSelect.dispatchEvent(event);
                }
                if (parsedData.theme) {
                    themeSelect.value = parsedData.theme;
                    updateTheme();
                }
                if (parsedData.tvMode !== undefined) {
                    tvModeInput.checked = parsedData.tvMode;
                    updateTVMode();
                }
                
                // Restore questions
                if (parsedData.questions && Array.isArray(parsedData.questions)) {
                    // Confirm if there are existing questions
                    if (gameState.questions.length > 0) {
                        if (!confirm('This will replace your current questions. Continue?')) {
                            return;
                        }
                    }
                    
                    gameState.questions = parsedData.questions;
                    renderQuestionsList();
                    alert(`Loaded ${gameState.questions.length} questions successfully!`);
                } else {
                    alert('No valid questions found in saved data.');
                }
            } catch (error) {
                alert('Error loading data: ' + error.message);
                console.error('Error loading data:', error);
            }
        });
        
        // Delete all questions
        deleteAllQuestionsBtn.addEventListener('click', () => {
            if (gameState.questions.length === 0) {
                alert('No questions to delete.');
                return;
            }
            
            if (confirm(`Are you sure you want to delete all ${gameState.questions.length} questions? This cannot be undone.`)) {
                gameState.questions = [];
                renderQuestionsList();
                alert('All questions have been deleted.');
            }
        });
        
        // Export questions to a JSON file
        const exportQuestionsBtn = document.getElementById('export-questions-btn');
        exportQuestionsBtn.addEventListener('click', () => {
            if (gameState.questions.length === 0) {
                alert('No questions to export. Please add questions first.');
                return;
            }
            
            try {
                // Get game data including settings
                const exportData = {
                    questions: gameState.questions,
                    team1Name: team1NameInput.value.trim() || 'Team 1',
                    team2Name: team2NameInput.value.trim() || 'Team 2',
                    maxStrikes: parseInt(maxStrikesInput.value) || 3,
                    bonusPoints: parseInt(bonusPointsInput.value) || 0,
                    numRounds: numRoundsInput.value ? parseInt(numRoundsInput.value) : null,
                    randomizeQuestions: randomizeQuestionsInput.checked,
                    variableAnswers: numAnswersSelect.value === 'variable',
                    exportDate: new Date().toISOString(),
                    version: '1.0'
                };
                
                // Convert to JSON string
                const jsonString = JSON.stringify(exportData, null, 2);
                
                // Create a download link
                const element = document.createElement('a');
                element.setAttribute('href', 'data:text/json;charset=utf-8,' + encodeURIComponent(jsonString));
                element.setAttribute('download', 'family-feud-questions.json');
                
                element.style.display = 'none';
                document.body.appendChild(element);
                
                element.click();
                
                document.body.removeChild(element);
                
                alert(`Successfully exported ${gameState.questions.length} questions!`);
            } catch (error) {
                alert('Error exporting questions: ' + error.message);
                console.error('Error exporting questions:', error);
            }
        });
        
        // Import questions from a JSON file
        const importQuestionsBtn = document.getElementById('import-questions-btn');
        const importFileInput = document.getElementById('import-file');
        
        importQuestionsBtn.addEventListener('click', () => {
            // Trigger file input click
            importFileInput.click();
        });
        
        importFileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            
            // Check if it's a JSON file
            if (!file.name.endsWith('.json')) {
                alert('Please select a valid JSON file.');
                importFileInput.value = ''; // Reset the input
                return;
            }
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    // Validate the imported data
                    if (!importedData.questions || !Array.isArray(importedData.questions) || importedData.questions.length === 0) {
                        alert('Invalid question data in the file.');
                        return;
                    }
                    
                    // Check if there are existing questions
                    if (gameState.questions.length > 0) {
                        if (!confirm(`You have ${gameState.questions.length} existing questions. Do you want to replace them with the ${importedData.questions.length} imported questions?`)) {
                            if (confirm('Would you like to merge the imported questions with your existing ones instead?')) {
                                // Merge questions
                                gameState.questions = [...gameState.questions, ...importedData.questions];
                                renderQuestionsList();
                                alert(`Merged ${importedData.questions.length} questions with your existing questions. You now have ${gameState.questions.length} questions.`);
                            }
                            return;
                        }
                    }
                    
                    // Import questions
                    gameState.questions = importedData.questions;
                    
                    // Import settings if available
                    if (importedData.team1Name) team1NameInput.value = importedData.team1Name;
                    if (importedData.team2Name) team2NameInput.value = importedData.team2Name;
                    if (importedData.maxStrikes) maxStrikesInput.value = importedData.maxStrikes;
                    if (importedData.bonusPoints !== undefined) bonusPointsInput.value = importedData.bonusPoints;
                    if (importedData.numRounds) numRoundsInput.value = importedData.numRounds;
                    if (importedData.randomizeQuestions !== undefined) randomizeQuestionsInput.checked = importedData.randomizeQuestions;
                    if (importedData.variableAnswers !== undefined) {
                        numAnswersSelect.value = importedData.variableAnswers ? 'variable' : '4';
                        // Trigger the change event to update UI
                        const event = new Event('change');
                        numAnswersSelect.dispatchEvent(event);
                    }
                    
                    // Update the questions list display
                    renderQuestionsList();
                    
                    alert(`Successfully imported ${gameState.questions.length} questions!`);
                    
                    // Save to localStorage too
                    if (confirm('Would you like to save these imported questions to your browser storage as well?')) {
                        saveQuestionsBtn.click();
                    }
                    
                } catch (error) {
                    alert('Error parsing imported file: ' + error.message);
                    console.error('Error parsing imported file:', error);
                }
                
                // Reset the file input
                importFileInput.value = '';
            };
            
            reader.onerror = function() {
                alert('Error reading file');
                importFileInput.value = '';
            };
            
            reader.readAsText(file);
        });
        
        // Check for saved questions on page load
        window.addEventListener('DOMContentLoaded', () => {
            try {
                const savedData = localStorage.getItem('familyFeudData');
                if (savedData) {
                    const parsedData = JSON.parse(savedData);
                    const questionCount = parsedData.questions?.length || 0;
                    if (questionCount > 0) {
                        const loadMessage = `Found ${questionCount} saved questions. Click "Load Saved Questions" to use them.`;
                        const messageEl = document.createElement('div');
                        messageEl.textContent = loadMessage;
                        messageEl.style.color = '#FFD700';
                        messageEl.style.marginTop = '10px';
                        loadQuestionsBtn.parentNode.appendChild(messageEl);
                    }
                }
            } catch (error) {
                console.error('Error checking for saved questions:', error);
            }
        });
    </script>
</body>
</html>
